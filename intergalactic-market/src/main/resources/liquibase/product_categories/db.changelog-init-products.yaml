databaseChangelog:
  - changeSet:
      id: lab-3-1-2
      author: dlitvak
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)

        - addUniqueConstraint:
            tableName: products
            columnNames: name
            constraintName: uc_product_name

        - createIndex:
            tableName: products
            indexName: idx_product_name
            columns:
              - column:
                  name: name